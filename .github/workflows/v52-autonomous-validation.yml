name: GannWyck V5.2 Autonomous Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: gannwyck-v52-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run autonomous V5.2 validation
        env:
          SYMBOL: BTCUSDT
          TIMEFRAMES: 1h,4h,12h,1d
          MAX_CANDLES: 50000
          MAX_BARS: 120
          WARMUP: 100
        run: node bot/run-v52.mjs
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gannwyck-v52-${{ github.run_number }}
          path: bot-results/
          retention-days: 30
      - name: Publish summary
        if: always()
        run: if [ -f bot-results/SUMMARY.md ]; then cat bot-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi
