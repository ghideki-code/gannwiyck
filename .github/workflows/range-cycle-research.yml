name: GannWyck Range Model1 Cycle Research

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run real Binance cycle research
        env:
          SYMBOL: BTCUSDT
          TIMEFRAMES: 1h,4h,12h,1d
          MAX_CANDLES: 5000
          PIVOT_LEN: 5
          MIN_BARS: 12
          MAX_BARS: 300
        run: node bot/range-model1-crossanalysis-v01.mjs > range-cycle-research.json
      - name: Upload research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gannwyck-range-cycle-${{ github.run_number }}
          path: range-cycle-research.json
          retention-days: 30
      - name: Publish V0.4 robustness summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const d=require('./range-cycle-research.json');
          console.log('# V0.4 RR robustness diagnostics');
          for(const x of d.results){
            const a=x.rrAudit||{};
            console.log('\n## '+x.tf);
            console.log(JSON.stringify({
              closed:a.closed,
              rrDistribution:a.rrDistribution,
              top1R:a.top1R,
              top3R:a.top3R,
              top1Share:a.top1Share,
              top3Share:a.top3Share,
              capSensitivity:a.capSensitivity,
              oneEventPerResearchRange:a.oneEventPerResearchRange,
              mechanics:a.mechanics
            },null,2));
          }
          NODE
