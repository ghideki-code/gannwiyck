name: GannWyck Range Model1 Cycle Research

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run real Binance cycle research
        env:
          SYMBOL: BTCUSDT
          TIMEFRAMES: 1h,4h,12h,1d
          MAX_CANDLES: 5000
          PIVOT_LEN: 5
          MIN_BARS: 12
          MAX_BARS: 300
        run: node bot/range-model1-crossanalysis-v01.mjs > range-cycle-research.json
      - name: Upload research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gannwyck-range-cycle-${{ github.run_number }}
          path: range-cycle-research.json
          retention-days: 30
      - name: Publish cycle summary
        if: always()
        run: cat range-cycle-research.json | head -c 12000 >> "$GITHUB_STEP_SUMMARY"
